spring.profiles.active=dev
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

server.port=${PORT:8080}
spring.application.name=enterprise-procurement-system
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-15b7891f-procurement-system.j.aivencloud.com:20743/defaultdb?sslMode=REQUIRED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:your_db_password_here}

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.hibernate.ddl-auto=update

jwt.secret_key=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:procuresupportteam@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

groq.api.key.part1=${GROQ_API_KEY_PART1:your_groq_key_part1}
groq.api.key.part2=${GROQ_API_KEY_PART2:your_groq_key_part2}